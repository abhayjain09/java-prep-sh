name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: AWS access key ID for this deployment run
        required: true
      aws_secret_access_key:
        description: AWS secret access key for this deployment run
        required: true
      aws_session_token:
        description: Optional AWS session token for temporary credentials
        required: false
        default: ""
      aws_region:
        description: AWS region to deploy into
        required: false
        default: us-east-1
      action:
        description: Terraform action
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
          - destroy
      image_tag:
        description: Docker image tag (leave blank to auto-generate sha-XXXXXXXX)
        required: false
        default: ""
      project_name:
        description: Short project name used in AWS resource names
        required: false
        default: orders
      environment_name:
        description: Environment suffix used in AWS resource names
        required: false
        default: test
      skip_build:
        description: Skip building API and web images
        type: boolean
        required: false
        default: false
      skip_support_image_mirror:
        description: Skip mirroring Postgres and Redis into private ECR
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"
  TF_DIR: aws/terraform
  TF_STATE_KEY: ecs/terraform.tfstate
  POSTGRES_IMAGE_TAG: "16-alpine"
  TF_IN_AUTOMATION: "true"

jobs:
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-8)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

  bootstrap:
    name: Bootstrap AWS state
    runs-on: ubuntu-latest
    outputs:
      account_id: ${{ steps.derive.outputs.account_id }}
      tf_state_bucket: ${{ steps.derive.outputs.tf_state_bucket }}
      ecr_registry: ${{ steps.derive.outputs.ecr_registry }}
      name_prefix: ${{ steps.derive.outputs.name_prefix }}
      cluster_name: ${{ steps.derive.outputs.cluster_name }}
      api_repo: ${{ steps.derive.outputs.api_repo }}
      web_repo: ${{ steps.derive.outputs.web_repo }}
      postgres_repo: ${{ steps.derive.outputs.postgres_repo }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region }}

      - name: Derive runtime names
        id: derive
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ inputs.aws_region }}"
          PROJECT="${{ inputs.project_name }}"
          ENVIRONMENT="${{ inputs.environment_name }}"
          PREFIX="${PROJECT}-${ENVIRONMENT}"
          TF_BUCKET="${PREFIX}-tfstate-${ACCOUNT_ID}"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          CLUSTER_NAME="${PREFIX}-cluster"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "tf_state_bucket=$TF_BUCKET" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "name_prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "api_repo=${PREFIX}-api" >> "$GITHUB_OUTPUT"
          echo "web_repo=${PREFIX}-web" >> "$GITHUB_OUTPUT"
          echo "postgres_repo=${PREFIX}-postgres" >> "$GITHUB_OUTPUT"

      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET="${{ steps.derive.outputs.tf_state_bucket }}"
          REGION="${{ inputs.aws_region }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket already exists."
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

  create-ecr:
    name: Create ECR repositories
    runs-on: ubuntu-latest
    needs: [resolve-tag, bootstrap]
    if: ${{ inputs.action == 'apply' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.tf_state_bucket }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Apply ECR repositories only
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -target='aws_ecr_repository.repositories["api"]' \
            -target='aws_ecr_repository.repositories["web"]' \
            -target='aws_ecr_repository.repositories["postgres"]' \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="project_name=${{ inputs.project_name }}" \
            -var="environment=${{ inputs.environment_name }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -var="postgres_image_tag=${{ env.POSTGRES_IMAGE_TAG }}"

  mirror-support-images:
    name: Mirror ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [bootstrap, create-ecr]
    if: ${{ inputs.action == 'apply' && inputs.skip_support_image_mirror != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres
            source: postgres:16-alpine
            repo_output: postgres_repo
            tag: 16-alpine
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, retag, and push support image
        run: |
          REPO="${{ needs.bootstrap.outputs.postgres_repo }}"
          DEST="${{ needs.bootstrap.outputs.ecr_registry }}/${REPO}"
          docker pull "${{ matrix.source }}"
          docker tag "${{ matrix.source }}" "${DEST}:${{ matrix.tag }}"
          docker tag "${{ matrix.source }}" "${DEST}:latest"
          docker push "${DEST}:${{ matrix.tag }}"
          docker push "${DEST}:latest"

  build-app-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, bootstrap, create-ecr]
    if: ${{ inputs.action == 'apply' && inputs.skip_build != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: spring
            repo: api
          - service: web
            context: angular
            repo: web
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve repository name
        id: repo
        run: |
          if [ "${{ matrix.repo }}" = "api" ]; then
            echo "name=${{ needs.bootstrap.outputs.api_repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ needs.bootstrap.outputs.web_repo }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:${{ needs.resolve-tag.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.repo.outputs.name }}:latest

  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - bootstrap
      - create-ecr
      - mirror-support-images
      - build-app-images
    if: |
      always() &&
      needs.bootstrap.result == 'success' &&
      (needs.create-ecr.result == 'success' || needs.create-ecr.result == 'skipped') &&
      (needs.mirror-support-images.result == 'success' || needs.mirror-support-images.result == 'skipped') &&
      (needs.build-app-images.result == 'success' || needs.build-app-images.result == 'skipped')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.tf_state_bucket }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        if: ${{ inputs.action != 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="project_name=${{ inputs.project_name }}" \
            -var="environment=${{ inputs.environment_name }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -var="postgres_image_tag=${{ env.POSTGRES_IMAGE_TAG }}" \
            -out=tfplan \
            -input=false

      - name: Plan summary
        if: ${{ inputs.action != 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan | tail -40 >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="project_name=${{ inputs.project_name }}" \
            -var="environment=${{ inputs.environment_name }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -var="postgres_image_tag=${{ env.POSTGRES_IMAGE_TAG }}" \
            -auto-approve \
            -input=false

      - name: Wait for ECS services
        if: ${{ inputs.action == 'apply' }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          PREFIX="${{ needs.bootstrap.outputs.name_prefix }}"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services \
              "${PREFIX}-postgres" \
              "${PREFIX}-api" \
              "${PREFIX}-web"

      - name: Deployment summary
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          APP_URL=$(terraform output -raw application_url)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS Account | ${{ needs.bootstrap.outputs.account_id }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | ${{ inputs.aws_region }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | ${{ needs.resolve-tag.outputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS Cluster | ${{ needs.bootstrap.outputs.cluster_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ALB DNS | ${ALB_DNS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application URL | ${APP_URL} |" >> "$GITHUB_STEP_SUMMARY"
